<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SafeHer Live</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  
  body {
    background: #0A0A14;
    color: white;
    font-family: -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .header {
    text-align: center;
    margin-bottom: 16px;
  }

  .live-dot {
    display: inline-block;
    width: 10px; height: 10px;
    background: #FF2D55;
    border-radius: 50%;
    margin-right: 6px;
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.3); }
  }

  h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; }

  .status {
    font-size: 0.85rem;
    color: #8892B0;
    margin-bottom: 16px;
  }
  .status.live { color: #30D158; }
  .status.error { color: #FF3B5C; }

  .video-wrap {
    width: 100%;
    max-width: 480px;
    aspect-ratio: 16/9;
    background: #111;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    border: 2px solid rgba(255,45,85,0.3);
    box-shadow: 0 0 40px rgba(255,45,85,0.15);
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: #000;
  }

  .loading-overlay {
    position: absolute;
    inset: 0;
    background: rgba(10,10,20,0.8);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(255,45,85,0.2);
    border-top-color: #FF2D55;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.6);
  }

  .info {
    margin-top: 12px;
    font-size: 0.75rem;
    color: #555;
    text-align: center;
  }

  .retry-btn {
    margin-top: 16px;
    padding: 10px 24px;
    background: #FF2D55;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    display: none;
  }
</style>
</head>
<body>

<div class="header">
  <h1>🛡️ SafeHer Live</h1>
  <div class="status" id="status">
    <span class="live-dot" id="dot" 
      style="background:#555;animation:none"></span>
    Connecting...
  </div>
</div>

<div class="video-wrap">
  <video id="remoteVideo" 
    autoplay 
    playsinline 
    controls>
  </video>
  <div class="loading-overlay" id="overlay">
    <div class="spinner"></div>
    <div class="loading-text" id="overlayText">
      Connecting to stream...
    </div>
  </div>
</div>

<div class="info" id="info">Waiting for video...</div>
<button class="retry-btn" id="retryBtn" onclick="location.reload()">
  🔄 Retry
</button>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
const params = new URLSearchParams(location.search);
const streamerId = params.get('id');

const videoEl = document.getElementById('remoteVideo');
const statusEl = document.getElementById('status');
const dotEl = document.getElementById('dot');
const overlay = document.getElementById('overlay');
const overlayText = document.getElementById('overlayText');
const infoEl = document.getElementById('info');
const retryBtn = document.getElementById('retryBtn');

function setStatus(text, type) {
  const colors = { live: '#30D158', error: '#FF3B5C', connecting: '#FF9F0A' };
  statusEl.innerHTML = `
    <span style="display:inline-block;width:10px;height:10px;
      background:${colors[type]||'#555'};border-radius:50%;
      margin-right:6px;
      ${type==='live'?'animation:pulse 1.2s ease-in-out infinite':''}">
    </span>${text}`;
}

if (!streamerId) {
  setStatus('Invalid link — no stream ID found', 'error');
  overlay.style.display = 'none';
  retryBtn.style.display = 'block';
  throw new Error('No stream ID');
}

infoEl.textContent = 'Stream ID: ' + streamerId;
setStatus('Connecting...', 'connecting');

// Create viewer peer
const viewer = new Peer({
  host: '0.peerjs.com',
  port: 443,
  secure: true,
  path: '/',
  config: {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:global.stun.twilio.com:3478' }
    ]
  }
});

viewer.on('open', (myId) => {
  console.log('[Watch] Viewer peer open:', myId);
  overlayText.textContent = 'Calling streamer...';
  setStatus('Calling streamer...', 'connecting');

  // Call the streamer
  // Send an empty stream — streamer will send us their video
  const emptyStream = new MediaStream();
  const call = viewer.call(streamerId, emptyStream);

  if (!call) {
    setStatus('Could not reach streamer. They may be offline.', 'error');
    overlay.innerHTML = '<div style="color:#FF3B5C;font-size:0.9rem;text-align:center;padding:16px">Streamer offline or link expired</div>';
    retryBtn.style.display = 'block';
    return;
  }

  call.on('stream', (remoteStream) => {
    console.log('[Watch] Got stream!', remoteStream.getTracks());

    const tracks = remoteStream.getTracks();
    console.log('[Watch] Track count:', tracks.length);
    tracks.forEach(t => {
      console.log('[Watch] Track:', t.kind, 'enabled:', t.enabled, 
        'readyState:', t.readyState);
    });

    if (tracks.length === 0) {
      setStatus('Connected but no video tracks received', 'error');
      return;
    }

    // Set video source — THIS is the critical fix
    videoEl.srcObject = remoteStream;

    // Force play
    videoEl.play().then(() => {
      console.log('[Watch] ✅ Video playing');
      overlay.style.display = 'none';
      setStatus('🔴 LIVE — Watching stream', 'live');
      infoEl.textContent = 'Connected at ' + new Date().toLocaleTimeString();
    }).catch(err => {
      console.error('[Watch] Play failed:', err.message);
      // On some browsers autoplay is blocked — show tap to play
      overlay.innerHTML = `
        <div style="text-align:center;padding:16px">
          <div style="font-size:2rem;margin-bottom:8px">▶️</div>
          <div style="font-size:0.9rem;margin-bottom:12px">
            Tap to start watching</div>
          <button onclick="videoEl.play();this.parentElement.parentElement.style.display='none'"
            style="background:#FF2D55;color:white;border:none;
            padding:10px 24px;border-radius:10px;font-size:0.9rem;
            font-weight:700;cursor:pointer">
            Watch Live
          </button>
        </div>`;
      setStatus('🔴 LIVE — Tap to play', 'live');
    });
  });

  call.on('error', (err) => {
    console.error('[Watch] Call error:', err);
    setStatus('Connection error: ' + err.message, 'error');
    retryBtn.style.display = 'block';
  });

  call.on('close', () => {
    console.log('[Watch] Stream ended');
    setStatus('Stream ended', 'error');
    overlay.innerHTML = '<div style="color:#999;padding:16px;text-align:center">Stream has ended</div>';
    overlay.style.display = 'flex';
  });
});

viewer.on('error', (err) => {
  console.error('[Watch] Peer error:', err.type, err.message);

  const messages = {
    'peer-unavailable': 'Streamer is offline or link has expired',
    'network': 'Network error — check your connection',
    'server-error': 'Server error — try again',
    'browser-incompatible': 'Your browser does not support WebRTC'
  };

  const msg = messages[err.type] || err.message;
  setStatus(msg, 'error');
  overlay.innerHTML = `<div style="color:#FF3B5C;padding:16px;
    text-align:center;font-size:0.85rem">${msg}</div>`;
  retryBtn.style.display = 'block';
});

// Timeout — if no stream in 20 seconds
setTimeout(() => {
  if (videoEl.srcObject === null) {
    setStatus('Stream not found — streamer may be offline', 'error');
    overlay.innerHTML = `<div style="color:#FF9F0A;padding:16px;
      text-align:center;font-size:0.85rem">
      No stream found after 20 seconds.<br/>
      Make sure streamer has started Live Stream.
    </div>`;
    retryBtn.style.display = 'block';
  }
}, 20000);
</script>
</body>
</html>
